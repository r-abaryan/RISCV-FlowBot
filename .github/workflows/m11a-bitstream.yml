# M11a: manual-only, ONE synth -> nextpnr (seed 1) -> ecppack run of ulx3s_top on LFE5U-85F-6BG381C at 25 MHz.
# Uses scripts/build_ulx3s_bitstream.sh and the same pinned OSS CAD Suite as pnr-soc-top.yml.
# Output is a bitstream candidate + estimate-level timing only. NOT a board result. No runtime claim.
# --timing-allow-fail keeps reports; timing verdict is classified separately and a failure fails the job.
name: m11a-bitstream
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  OSS_CAD_URL: https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-14/oss-cad-suite-linux-x64-20261014.tgz
  OSS_CAD_SHA256: a6ccc6b96b2d985336a1061c78b2fd2bdd73e0f68690da17db88e00457881a11
jobs:
  bitstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OSS CAD Suite
        run: |
          set -euo pipefail
          mkdir -p out_m11a
          curl -sL --retry 3 -o oss.tgz "$OSS_CAD_URL"
          echo "$OSS_CAD_SHA256  oss.tgz" | sha256sum -c - | tee out_m11a/oss_sha_check.txt
          tar xzf oss.tgz
          rm oss.tgz
      - name: Synth, PnR, pack
        run: |
          OSS="$PWD/oss-cad-suite" OUT=out_m11a scripts/build_ulx3s_bitstream.sh all
      - name: Classify result
        if: always()
        run: |
          set -uo pipefail
          for f in yosys_exit pnr_exit ecppack_exit; do echo "$f=$(cat out_m11a/$f.txt 2>/dev/null || echo missing)"; done | tee out_m11a/exit_summary.txt
          grep -E "Max frequency|ERROR" out_m11a/nextpnr.log | tail -8 | tee out_m11a/fmax_summary.txt
          sha256sum out_m11a/ulx3s_top.bit 2>/dev/null | tee -a out_m11a/exit_summary.txt
          grep -q "yosys_exit=0" out_m11a/exit_summary.txt && grep -q "pnr_exit=0" out_m11a/exit_summary.txt && grep -q "ecppack_exit=0" out_m11a/exit_summary.txt
          rc=$?
          python3 scripts/pnr_classify.py --help >/dev/null 2>&1 && echo "pnr_classify available; run manually on artifacts" >> out_m11a/exit_summary.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11a-bitstream
          path: out_m11a/
          if-no-files-found: warn
