# Manual-only nextpnr-ecp5 place-and-route FEASIBILITY of ulx3s_top (wrapper + flat soc_top) on LFE5U-85F CABGA381 (M8C).
# Device LFE5U-85F-6BG381C, 25 MHz board clock from fpga/ulx3s/ulx3s_85f.lpf, 3 seeds. No bitstream, no hardware.
# Artifacts are uploaded with if: always(). Each seed is classified TIMING_MET / TIMING_FAILED / ROUTING_FAILURE /
# SETUP_FAILURE by scripts/pnr_classify.py; only TIMING_MET is a green job. --timing-allow-fail only keeps reports.
name: pnr-soc-top
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  OSS_CAD_URL: https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-14/oss-cad-suite-linux-x64-20261014.tgz
  OSS_CAD_SHA256: a6ccc6b96b2d985336a1061c78b2fd2bdd73e0f68690da17db88e00457881a11
jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned OSS CAD Suite
        run: |
          set -euo pipefail
          mkdir -p out
          curl -sL --retry 3 -o oss.tgz "$OSS_CAD_URL"
          echo "$OSS_CAD_SHA256  oss.tgz" | sha256sum -c - | tee out/oss_sha_check.txt
          tar xzf oss.tgz
          . oss-cad-suite/environment
          { yosys -V; nextpnr-ecp5 --version; } 2>&1 | tee out/tool_versions.txt
      - name: Reproducibility metadata
        run: |
          mkdir -p out
          {
            echo "git_sha=$GITHUB_SHA"; echo "git_ref=$GITHUB_REF"; echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_image=${ImageOS:-?} ${ImageVersion:-?}"; uname -a
            echo "oss_cad_url=$OSS_CAD_URL"; echo "oss_cad_sha256=$OSS_CAD_SHA256"
            echo "device=LFE5U-85F-6BG381C speed 6 clock 25 MHz"
          } > out/metadata.txt
          sha256sum fpga/ulx3s/ulx3s_85f.lpf fpga/ulx3s/ulx3s_top.v rtl/soc_top.v sw/firmware/robot_nav.hex \
            scripts/check_rom_mapped.py scripts/check_lpf_ports.py scripts/pnr_classify.py >> out/metadata.txt
      - name: Synthesize (synth_ecp5) and write JSON
        run: |
          set -uo pipefail
          . oss-cad-suite/environment
          SRC="rtl/nna/*.v rtl/safety/*.v rtl/periph/*.v rtl/mem/*.v rtl/bus/*.v rtl/cpu/picorv32.v rtl/soc_top.v"
          yosys -l out/synth.log -p "read_verilog -DSYNTHESIS -Irtl fpga/ulx3s/ulx3s_top.v $SRC; hierarchy -check -top ulx3s_top; synth_ecp5 -top ulx3s_top -noabc9; tee -o out/stat.txt stat; write_rtlil out/netlist.il; write_json out/soc_top.json" > out/yosys_stdout.txt 2>&1
          echo $? > out/yosys_exit.txt
          [ "$(cat out/yosys_exit.txt)" = 0 ] || { tail -30 out/yosys_stdout.txt; exit 1; }
          grep -E "LUT4|TRELLIS_FF|DP16KD|MULT18X18D|CCU2C|TRELLIS_DPR16X4" out/stat.txt | tee out/stat_summary.txt
      - name: Mandatory mapped-ROM content check (no bypass)
        run: |
          set -uo pipefail
          python3 scripts/check_rom_mapped.py sw/firmware/robot_nav.hex out/netlist.il:u_soc.u_rom. 2>&1 | tee out/rom_mapped_check.txt
          rc=${PIPESTATUS[0]}; echo $rc > out/rom_check_exit.txt
          if [ $rc != 0 ]; then
            echo "ROM check failed: DP16KD cell names in netlist follow:"
            grep -n "cell .DP16KD" out/netlist.il | tee out/dp16kd_cell_names.txt | head -40
            exit 1
          fi
      - name: LPF vs top-level ports cross-check
        run: |
          set -uo pipefail
          python3 scripts/check_lpf_ports.py out/soc_top.json ulx3s_top fpga/ulx3s/ulx3s_85f.lpf 2>&1 | tee out/lpf_port_check.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc_top-json
          path: out/
          if-no-files-found: warn
  pnr:
    needs: synth
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soc_top-json
          path: in
      - name: Install pinned OSS CAD Suite
        run: |
          set -euo pipefail
          mkdir -p res
          curl -sL --retry 3 -o oss.tgz "$OSS_CAD_URL"
          echo "$OSS_CAD_SHA256  oss.tgz" | sha256sum -c - | tee res/oss_sha_check.txt
          tar xzf oss.tgz
          . oss-cad-suite/environment
          nextpnr-ecp5 --version > res/nextpnr_version.txt 2>&1
          cp in/metadata.txt res/metadata_synth.txt
          sha256sum in/soc_top.json >> res/metadata_synth.txt
      - name: nextpnr-ecp5 (LFE5U-85F, CABGA381, speed 6, ULX3S LPF, 25 MHz)
        run: |
          set -uo pipefail
          . oss-cad-suite/environment
          mkdir -p res
          CMD="nextpnr-ecp5 --85k --package CABGA381 --speed 6 --json in/soc_top.json --lpf fpga/ulx3s/ulx3s_85f.lpf --freq 25 --seed ${{ matrix.seed }} --timing-allow-fail --report res/report.json --log res/nextpnr.log"
          echo "$CMD" > res/command.txt
          # --timing-allow-fail only keeps nextpnr from aborting on missed timing; it does NOT mean timing is met.
          $CMD > res/stdout.txt 2>&1
          echo $? > res/exit.txt
          echo "nextpnr exit: $(cat res/exit.txt) (not a timing verdict)"
          grep -E "Device utilisation|TRELLIS_FF|LUT4|DP16KD|MULT18X18D|Max frequency|ERROR|WARNING" res/nextpnr.log | tail -60 > res/summary.txt || true
          cat res/summary.txt
          # preserve the per-seed timing report text and the LPF-related warnings separately
          grep -E "Max frequency|Critical path|Slack|Info: Max delay" res/nextpnr.log > res/timing_report.txt || true
          grep -iE "lpf|unconstrained|no .*(LOC|constraint)|ignoring" res/nextpnr.log > res/lpf_warnings.txt || true
          cp fpga/ulx3s/ulx3s_85f.lpf res/
          exit 0
      - name: Classify result (TIMING_MET / TIMING_FAILED / ROUTING_FAILURE / SETUP_FAILURE)
        run: |
          mkdir -p res
          python3 scripts/pnr_classify.py res | tee res/classification.txt
          rc=${PIPESTATUS[0]}
          { echo "### seed ${{ matrix.seed }}: $(head -1 res/result.txt)"; sed -n 2p res/result.txt; } >> "$GITHUB_STEP_SUMMARY"
          # Only TIMING_MET is green; any other class fails the job (artifacts still uploaded below).
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnr-seed${{ matrix.seed }}
          path: res/
          if-no-files-found: warn
